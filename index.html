<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Um convite para você ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- TELA PRINCIPAL -->
    <div class="container" id="telaPrincipal">

        <div class="coracoes">❤️ 💕 ❤️ 💕 ❤️</div>

        <h1>Tenho uma pergunta para você... </h1>

        <p>Você gostaria de sair comigo?</p>

        <div class="botoes">

            <button id="sim">SIM ❤️</button>

            <button id="nao">NÃO 😢</button>

        </div>

    </div>


    <!-- TELA DEPOIS DO SIM -->
    <div class="container escondido" id="telaSim">

        <div class="coracoes">❤️ 💕 ❤️ 💕 ❤️</div>

        <h1>EU SABIA QUE VC IA ACEITAR! 😍❤️</h1>

        <p>
            Então está combinado! 🥰
        </p>

        <p>
            Agora só falta dizer o dia que posso te buscar. ❤️
        </p>

        <div class="emoji">
            🥰❤️🥰
        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
